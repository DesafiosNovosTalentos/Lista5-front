<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/editOrder.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1>Editar Pedido</h1>
        <a href="/view/home.html" class="link-back">Voltar para a Home</a>
    </header>
    <main class="form-container">
        <section>
            <p id="loading-msg" class="loading-text">Carregando dados do pedido...</p>
            <form id="edit-order-form" class="hidden" onsubmit="submitEdit(event)">
                <input type="hidden" id="order-id">
                <div class="form-group">
                    <label for="product-name">Nome do Produto</label>
                    <input type="text" id="product-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="amount">Quantidade</label>
                    <input type="number" id="amount" class="form-control" min="1" required>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </form>
        </section>
    </main>
</body>

</html>
