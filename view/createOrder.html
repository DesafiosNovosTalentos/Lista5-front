<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Pedido</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/create.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1>Novo Pedido</h1>
        <a href="/view/home.html" class="link-back">Voltar para a Home</a>
    </header>

    <main class="form-container">
        <section>
            <form id="create-post-form" onsubmit="createOrder(event)">
                <div class="form-group">
                    <label for="product_name">Nome do produto: </label>
                    <input type="text" id="product_name" name="product_name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="amount">Quantidade: </label>
                    <input type="number" id="amount" name="amount" class="form-control" min="1" value="1" required>
                </div>


                <button type="submit" class="btn btn-primary">Realizar pedido</button>
            </form>
        </section>
    </main>
</body>

</html>
